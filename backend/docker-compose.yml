services:
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: parkease-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      SPRING_MONGODB_URI: "mongodb://mongodb:27017/parking_system"
      MONGODB_DATABASE: "parking_system"
      PARKEASE_ADMIN_EMAIL: "${PARKEASE_ADMIN_EMAIL:-admin@parkease.com}"
      PARKEASE_ADMIN_PASSWORD: "${PARKEASE_ADMIN_PASSWORD:-AdminSecurePass123!}"
      PARKEASE_ADMIN_NAME: "${PARKEASE_ADMIN_NAME:-ParkEase Admin}"
      LOG_APP_LEVEL: "${LOG_APP_LEVEL:-INFO}"
      LOG_CONFIG_LEVEL: "${LOG_CONFIG_LEVEL:-INFO}"
      LOG_MONGO_LEVEL: "${LOG_MONGO_LEVEL:-INFO}"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - parkease-network

  mongodb:
    image: mongo:7.0
    container_name: parkease-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: parking_system
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - parkease-network

volumes:
  mongodb_data:
    driver: local

networks:
  parkease-network:
    driver: bridge
