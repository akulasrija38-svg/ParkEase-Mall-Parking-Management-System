spring.application.name=parking-system
server.port=8080

spring.mongodb.uri=mongodb://127.0.0.1:27018/parking_system
spring.mongodb.database=parking_system



# Local development admin bootstrap.
# Change these credentials before using the app beyond local testing.
parkease.admin.email=${PARKEASE_ADMIN_EMAIL:admin@parkease.com}
parkease.admin.password=${PARKEASE_ADMIN_PASSWORD}
parkease.admin.name=${PARKEASE_ADMIN_NAME:ParkEase Admin}

logging.level.org.springframework.boot.context.config=TRACE
logging.level.org.springframework.data.mongodb=DEBUG
